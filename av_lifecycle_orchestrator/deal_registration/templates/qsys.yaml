manufacturer: qsys
registration_method: portal_api
api_endpoint: https://partners.qsys.com/api/deal-registration
auth:
  type: session
  login_url: https://partners.qsys.com/login
email_to: null
processing_time_hours: null
approval_window_days: null
constraints:
  partner_hub_enrollment_required: true
  sdf_mdf_eligible: true
required_fields:
  - dealer_id
  - dealer_name
  - partner_hub_id
  - end_user_company
  - end_user_contact_name
  - end_user_contact_email
  - project_name
  - project_description
  - estimated_close_date
  - estimated_value
  - product_lines
notes: >
  Q-SYS deal registration is submitted via the Technology Partner Hub portal.
  Partners must be enrolled in the hub. Supports SDF (Sales Development Fund)
  and MDF (Market Development Fund) fields when applicable. Plugin requirements
  and certifications can be included.
