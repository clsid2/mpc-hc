manufacturer: extron
registration_method: portal_api
api_endpoint: https://insider.extron.com/api/deal-registration
auth:
  type: session
  login_url: https://insider.extron.com/login
email_to: null
processing_time_hours: null
approval_window_days: 90
constraints:
  not_pursued_by_extron_directly: true
  commitment_days: 90
required_fields:
  - dealer_id
  - dealer_name
  - insider_portal_id
  - end_user_company
  - end_user_contact_name
  - end_user_contact_email
  - project_name
  - project_description
  - estimated_close_date
  - estimated_value
  - product_lines
notes: >
  Extron deal registration is submitted via the Extron Insider portal.
  Requires Insider portal credentials and confirmation that the opportunity
  is not being pursued by Extron directly. Includes explicit Opportunity
  Registration Criteria certification. Approval window is 90 days with
  a tracked countdown deadline.
